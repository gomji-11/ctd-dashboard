<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css?v=2.2.2" />
  <title>CTD 관리시스템 · CTD 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="dashboard-body ctd-body">
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">CTD</div>
        <div><strong>CTD 구비현황</strong><span>관리시스템</span></div>
      </div>
      <nav class="sidebar-nav" aria-label="주 메뉴">
        <a href="index.html"><span>⌂</span>대시보드</a>
        <a href="ctd.html" class="active"><span>▣</span>CTD 관리</a>
      </nav>
      <div class="sidebar-version">Aju Healthcare<br />v2.2.2</div>
    </aside>

    <main class="dashboard-main ctd-main">
      <header class="dashboard-header ctd-page-header">
        <div><p class="eyebrow">CTD MANAGEMENT</p><h1>CTD 관리</h1><p class="ctd-header-copy">자사·위탁 품목별 CTD 구비현황을 관리합니다.</p></div>
        <a href="index.html" class="manage-link">대시보드 바로가기 <span>→</span></a>
      </header>

    <section class="ctd-panel bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="ctd-toolbar p-6 border-b flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
        <div><h2 class="text-xl font-bold">품목별 CTD 현황</h2><p class="text-sm text-slate-500 mt-1">품목명 가나다순이 기본 정렬입니다.</p></div>
        <div class="flex flex-wrap gap-2">
          <button id="openAddModalBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">+ 품목 추가</button>
          <button id="backupDataBtn" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm hover:bg-emerald-700">JSON 백업</button>
          <label class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:bg-indigo-700 cursor-pointer">JSON 불러오기<input id="importDataInput" type="file" accept=".json" class="hidden" /></label>
          <button id="downloadCsvBtn" class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm hover:bg-slate-800">CSV 다운로드</button>
        </div>
      </div>

      <div class="ctd-filters p-6 border-b">
        <div class="inline-flex p-1 bg-slate-100 rounded-xl mb-4">
          <button class="type-tab px-5 py-2 rounded-lg font-semibold bg-white shadow-sm text-blue-700" data-type="자사제조">자사 품목 <span id="ownTabCount" class="ml-1 text-xs">0</span></button>
          <button class="type-tab px-5 py-2 rounded-lg font-semibold text-slate-600" data-type="위탁제조">위탁 품목 <span id="contractTabCount" class="ml-1 text-xs">0</span></button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto_auto] gap-3">
          <input id="searchInput" type="text" placeholder="품목명 / 허가번호 / 수탁제조사 검색" class="border rounded-xl px-4 py-3" />
          <select id="ctdFilter" class="border rounded-xl px-3 py-3"><option value="">CTD 전체</option><option value="true">CTD 전환</option><option value="false">CTD 미전환</option></select>
          <select id="statusFilter" class="border rounded-xl px-3 py-3"><option value="">허가 상태 전체</option><option value="허가">허가</option><option value="진행중">진행중</option><option value="보류">보류</option><option value="none">상태 없음</option></select>
        </div>
      </div>

      <div class="ctd-table-wrap overflow-x-auto">
        <table class="min-w-[1180px] w-full text-sm">
          <thead class="bg-slate-100 text-slate-700"><tr>
            <th class="px-5 py-4 text-left w-[250px]">품목명</th><th class="px-4 py-4 text-center w-[100px]">허가번호</th><th class="px-4 py-4 text-center w-[110px]">제조구분</th><th class="px-4 py-4 text-center w-[130px]">수탁제조사</th><th class="px-4 py-4 text-center w-[80px]">제형</th><th class="px-4 py-4 text-center w-[115px]">CTD 전환</th><th class="px-4 py-4 text-center w-[135px]">필수 구비율</th><th class="px-4 py-4 text-center w-[135px]">신버전 반영률</th><th class="px-4 py-4 text-center w-[90px]">허가상태</th><th class="px-4 py-4 text-center w-[75px]">관리</th>
          </tr></thead>
          <tbody id="productTableBody" class="divide-y divide-slate-100">
            <tr><td colspan="10" class="px-6 py-10 text-center text-slate-500">품목을 불러오는 중입니다...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    </main>
  </div>

  <div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 mx-4">
      <div class="flex justify-between items-center mb-6"><h2 id="modalTitle" class="text-xl font-bold">품목 추가</h2><button id="closeModalBtn" class="text-slate-400 hover:text-slate-700 text-2xl">&times;</button></div>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="editingProductId" />
        <div><label class="block text-sm font-medium mb-1">품목명</label><input id="productNameInput" type="text" required class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-medium mb-1">허가번호 (선택)</label><input id="approvalNumberInput" type="text" class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-medium mb-1">제조구분</label><select id="manufacturingTypeInput" class="w-full border rounded-lg px-3 py-2"><option value="자사제조">자사제조</option><option value="위탁제조">위탁제조</option></select></div>
        <div id="contractorField" class="hidden"><label class="block text-sm font-medium mb-1">수탁제조사</label><input id="contractorManufacturerInput" type="text" class="w-full border rounded-lg px-3 py-2" /></div>
        <div><label class="block text-sm font-medium mb-1">제형</label><select id="dosageFormInput" class="w-full border rounded-lg px-3 py-2"><option value="정제">정제</option><option value="캡슐제">캡슐제</option><option value="과립제">과립제</option><option value="산제">산제</option><option value="시럽제">시럽제</option><option value="액제">액제</option><option value="주사제">주사제</option><option value="점안제">점안제</option><option value="연고제">연고제</option><option value="크림제">크림제</option><option value="패취제">패취제</option><option value="기타">기타</option></select></div>
        <div><label class="block text-sm font-medium mb-1">CTD 전환 여부</label><select id="ctdConvertedInput" class="w-full border rounded-lg px-3 py-2"><option value="true">CTD 전환</option><option value="false">CTD 미전환</option></select></div>
        <div><label class="block text-sm font-medium mb-1">허가 상태 (선택)</label><select id="statusInput" class="w-full border rounded-lg px-3 py-2"><option value="">선택 안함</option><option value="허가">허가</option><option value="진행중">진행중</option><option value="보류">보류</option></select></div>
        <div class="md:col-span-2 flex justify-end gap-3 mt-4"><button type="button" id="cancelBtn" class="px-4 py-2 rounded-lg border">취소</button><button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">저장</button></div>
      </form>
    </div>
  </div>
  <script type="module" src="js/ctd.js?v=2.2.0"></script>
</body>
</html>
